<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGS Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700;900&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    /* apply the saved theme before first paint */
    try { const t = localStorage.getItem("cgs-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="compact.css">
</head>
<body>
  <header class="bar">
    <a class="logo" href="./">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" class="logo-bg"/><path d="M6 15.5 10 11l3 3 5-6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>CGS Portfolio</span>
    </a>
    <span class="wallets" id="wallets"></span>
    <div class="bar-right">
      <span class="upd" id="upd">Загрузка…</span>
      <button class="ibtn" id="refresh" title="Обновить сейчас" aria-label="Обновить сейчас">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="ibtn" id="theme" title="Светлая / тёмная тема" aria-label="Переключить тему">
        <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="tbtn" id="open-history">История</button>
      <button class="tbtn" id="open-settings">Параметры</button>
    </div>
  </header>

  <main class="screen">
    <section class="strip" id="strip" aria-label="Ключевые показатели"></section>
    <div id="notices"></div>

    <div class="grid">
      <section class="box" id="growth"></section>

      <aside class="right">
        <section class="box" id="signal"></section>
        <section class="box" id="rebalance"></section>

        <section class="box">
          <div class="box-h"><h2>Пополнение</h2><span class="muted">выравнивает Y/L и S/G</span></div>
          <div class="dep">
            <label class="money"><span>$</span><input id="deposit" type="text" inputmode="decimal" placeholder="Сумма" autocomplete="off"></label>
            <div class="quick" id="deposit-quick"><button data-v="1000">+1k</button><button data-v="5000">+5k</button><button data-v="10000">+10k</button></div>
          </div>
          <div id="planner-out"></div>
        </section>
      </aside>
    </div>

    <div class="pair">
      <section class="box" id="yield"></section>
      <section class="box" id="stability"></section>
    </div>
    <footer class="foot"><div class="other" id="other"></div><details class="srcbox" id="sources"><summary id="srcsum"></summary><div class="srcs" id="srclist"></div></details></footer>
  </main>

  <dialog id="history">
    <div class="dlg-h">
      <h2>История</h2>
      <div class="seg" id="hist-metric">
        <button class="active" data-m="total">Стоимость</button><button data-m="hf">HF</button><button data-m="sg">S/G</button><button data-m="yl">Y/L</button>
      </div>
      <form method="dialog"><button class="ibtn" aria-label="Закрыть">✕</button></form>
    </div>
    <p class="muted">Снимок при открытии и по ⟳, не чаще раза в час.</p>
    <div class="chart" id="chart"></div>
  </dialog>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Параметры CGS</h2>
      <p class="muted">Триггер — общий Health factor вне коридора.</p>
      <div class="settings-grid">
        <label>HF: нижняя граница<input name="hfLow" inputmode="decimal"></label>
        <label>HF: верхняя граница<input name="hfHigh" inputmode="decimal"></label>
        <label>HF: цель после действия<input name="hfTarget" inputmode="decimal"></label>
        <label>Доля Stability, % (30 → S/G 42,9%)<input name="stabilityShare" inputmode="decimal"></label>
        <label>Y/L цель, %<input name="ylTarget" inputmode="decimal"></label>
        <span></span>
        <label>Знаков после запятой, $<select name="usdDigits"><option value="">Авто</option><option>0</option><option>1</option><option>2</option></select></label>
        <label>Знаков после запятой, %<select name="pctDigits"><option value="">Авто</option><option>0</option><option>1</option><option>2</option></select></label>
      </div>
      <div class="backup">
        <span class="muted">Всё хранится в этом браузере. Перенос в другой браузер:</span>
        <button type="button" class="tbtn" id="backup-save">Скачать копию</button>
        <button type="button" class="tbtn" id="backup-load">Загрузить</button>
        <input type="file" id="backup-file" accept="application/json,.json" hidden>
      </div>
      <div class="dlg-actions">
        <button value="cancel" class="tbtn" formnovalidate>Отмена</button>
        <button value="save" class="pbtn">Сохранить</button>
      </div>
    </form>
  </dialog>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="core.js"></script>
  <script src="data.js"></script>
  <script src="wallets.js"></script>
  <script src="compact.js"></script>
</body>
</html>
